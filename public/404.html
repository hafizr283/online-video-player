<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0f">
<title>Not found — MovieLinkBD</title>
<link rel="stylesheet" href="/style/catalogue.css">
<style>
  .nf { max-width: 620px; margin: clamp(48px, 12vh, 140px) auto; padding: 0 20px; text-align: center; }
  .nf__code { font-size: clamp(72px, 16vw, 132px); font-weight: 800; letter-spacing: -.04em; line-height: .9;
    background: linear-gradient(135deg, #6ea8ff, #b06cff 60%, #ff6b9a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nf__title { margin: 18px 0 10px; font-size: 24px; }
  .nf__text { color: var(--muted, #9aa4b2); line-height: 1.65; margin: 0 auto 26px; max-width: 44ch; }
  .nf__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body class="browse">

<header class="site-bar">
  <a class="site-bar__logo" href="/"><b>Movie</b>LinkBD</a>
  <span class="site-bar__tag">Movies</span>
  <span class="site-bar__spacer"></span>
</header>

<main class="nf">
  <div class="nf__code">404</div>
  <h1 class="nf__title">That page is not in the library</h1>
  <p class="nf__text">
    The address may be mistyped, or the title was removed. Everything on the
    shelf is one click away.
  </p>
  <div class="nf__actions">
    <a class="btn btn--primary" href="/">Browse the library</a>
  </div>
</main>

<footer class="site-foot">
  <span>MovieLinkBD</span>
  <span>All titles stream from our own mirrors. No account required.</span>
</footer>

</body>
</html>
